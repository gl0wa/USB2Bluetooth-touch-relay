name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: User build (no networking)
        shell: bash
        run: |
          # The container entrypoint is bypassed, and the checkout is owned by
          # another user, which would otherwise break the git-based version.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py -B build-release \
            -DSDKCONFIG=build-release/sdkconfig \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" build
          python3 tools/merge_firmware.py \
            --build-dir build-release \
            --output build-release/u2b-touch-merged.bin
      - name: Generate Pages manifest
        run: |
          mkdir -p pages
          cp web/index.html web/styles.css web/app.js pages/
          cp build-release/u2b-touch-merged.bin pages/
          sed -e "s/__VERSION__/${{ github.ref_name }}/g" \
              -e "s/__MERGED_BIN__/u2b-touch-merged.bin/g" \
            web/manifest.template.json > pages/manifest.json
          cat pages/manifest.json
          ls -l pages/
      - name: Upload Pages files
        uses: actions/upload-artifact@v4
        with:
          name: pages-files
          path: pages/
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build-release/u2b-touch-merged.bin

  pages:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Pages files
        uses: actions/download-artifact@v4
        with:
          name: pages-files
          path: pages/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/
      - name: Attach merged binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/u2b-touch-merged.bin
          prerelease: ${{ contains(github.ref_name, '-') }}

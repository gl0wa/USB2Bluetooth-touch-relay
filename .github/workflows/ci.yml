name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: |
          cmake -S test/host -B build/host
          cmake --build build/host
          ./build/host/test_touchcore

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Development build
        shell: bash
        run: |
          # The container entrypoint is bypassed, and the checkout is owned by
          # another user, which would otherwise break the git-based version.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py build
      - name: User build (no networking)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-release \
            -DSDKCONFIG=build-release/sdkconfig \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" build
          python3 tools/merge_firmware.py \
            --build-dir build-release \
            --output build-release/u2b-touch-merged.bin
      - name: Check image sizes
        run: ls -l build/usb2bluetooth-touch-relay.bin build-release/usb2bluetooth-touch-relay.bin build-release/u2b-touch-merged.bin
